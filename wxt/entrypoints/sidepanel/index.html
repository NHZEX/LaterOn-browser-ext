<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 小红书等站点的图片 CDN 会拒绝来自 chrome-extension:// 的 Referer（返回 403），
         整页统一不发 Referer，收藏的封面与站点图标才能正常显示。 -->
    <meta name="referrer" content="no-referrer" />
    <title>StaySide · 项目型网页管理</title>
    <link rel="icon" href="/icon128.png" vite-ignore type="image/png" />

    <!-- ── 首屏「零依赖」样式 ─────────────────────────────────
         这段样式内联在这里，是浏览器画出第一批内容所需要的全部 CSS。
         为什么必须有它：外部样式表是「阻塞渲染」的——浏览器要等它们全部到齐
         才肯画第一个像素。万一浏览器迟迟送不来（扩展资源也偶发卡住），
         那段时间就是一整块白，连「正在打开…」都不会出现。
         现在有了这段内联样式，外部样式表可以放心改成异步加载：
         先靠这段把骨架屏和提示条画出来，外部样式表到了再接管（它排在后面，
         同名规则会覆盖这里的兜底版本，效果和以前完全一样）。 -->
    <style id="bootCriticalStyle">
      :root { color-scheme: light dark; }
      html, body { margin: 0; padding: 0; }
      body {
        padding: 12px 16px 20px;
        background: #f7f6f4;
        color: #23211e;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #16161a; color: #e9e7e4; }
      }
      /* 骨架屏在场时真界面不占位（等真内容画出来再露面）。 */
      body.booting #appBody { display: none; }

      #bootSkeleton { display: grid; gap: 10px; }
      .sk { background: #e4e1dd; border-radius: 8px; }
      @media (prefers-color-scheme: dark) { .sk { background: #26262c; } }
      .skel-save {
        display: grid; grid-template-columns: 52px minmax(0, 1fr) 54px; gap: 10px; align-items: center;
        padding: 9px; border-radius: 13px; background: #fff;
      }
      .skel-lines { display: grid; gap: 6px; }
      .sk-btn { height: 30px; border-radius: 9px; }
      .sk-thumb-sm { width: 52px; height: 52px; border-radius: 9px; }
      .sk-search { height: 36px; margin-top: 8px; border-radius: 10px; }
      .skel-filters { display: flex; align-items: center; gap: 3px; margin: 12px 1px 9px; }
      .sk-pill { width: 40px; height: 22px; border-radius: 99px; }
      .sk-count { width: 30px; height: 10px; margin-left: auto; border-radius: 5px; }
      .skel-chips { display: flex; gap: 5px; margin: 0 0 10px; }
      .sk-chip { height: 26px; border-radius: 8px; }
      .skel-list { display: grid; gap: 8px; }
      .skel-item { display: grid; grid-template-columns: 92px minmax(0, 1fr); overflow: hidden; border-radius: 12px; background: #fff; }
      .sk-thumb { width: 92px; height: 92px; border-radius: 0; }
      .skel-copy { display: grid; gap: 6px; align-content: center; padding: 11px 16px; }
      .sk-line { height: 11px; border-radius: 5px; }
      .sk-line.xs { height: 8px; }
      .sk-line.w90 { width: 90%; } .sk-line.w88 { width: 88%; } .sk-line.w85 { width: 85%; } .sk-line.w82 { width: 82%; }
      .sk-line.w80 { width: 80%; } .sk-line.w75 { width: 75%; } .sk-line.w72 { width: 72%; } .sk-line.w70 { width: 70%; }
      .sk-line.w66 { width: 66%; } .sk-line.w62 { width: 62%; } .sk-line.w60 { width: 60%; } .sk-line.w58 { width: 58%; }
      .sk-line.w55 { width: 55%; } .sk-line.w50 { width: 50%; } .sk-line.w48 { width: 48%; } .sk-line.w45 { width: 45%; }
      .sk-line.w40 { width: 40%; } .sk-line.w38 { width: 38%; } .sk-line.w35 { width: 35%; } .sk-line.w32 { width: 32%; }
      .sk-line.w30 { width: 30%; }
      .sk-chip.w60 { width: 60px; } .sk-chip.w80 { width: 80px; } .sk-chip.w50 { width: 50px; }
      @media (prefers-color-scheme: dark) {
        .skel-save, .skel-item { background: #1d1d22; }
      }
      /* 顶部标题栏（在 appBody 之外，启动时也能立刻显示出来认认脸） */
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .brand { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
      .brand-icon { display: block; width: 25px; height: 25px; border-radius: 6px; }
      #openLibrary { width: 28px; height: 28px; border: 0; background: transparent; color: inherit; }
      #openLibrary svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }

      /* 「正在打开…」提示条。注意 [hidden]：浏览器自带的隐藏规则敌不过我们自己写的
         display，必须显式写一条，否则「1.2 秒后才亮出来」会失效（一直显示）。 */
      #bootTip { display: flex; align-items: center; gap: 6px; margin: 10px 2px 0; color: #8b867f; font-size: 11px; }
      #bootTip[hidden] { display: none; }
      #bootTipTime { color: #a09a92; font-size: 10px; }
      #bootTipHint { display: block; color: #a09a92; font-size: 10px; line-height: 1.6; }
      #bootTip .boot-dot { width: 6px; height: 6px; border-radius: 50%; background: #945200; }
      @media (prefers-color-scheme: dark) {
        #bootTip { color: #8f8b86; }
        #bootTipTime, #bootTipHint { color: #77736f; }
      }
    </style>

    <!-- 下面的样式表故意「先不生效」（media=print）：这样它们不阻塞首屏渲染，
         由 boot.js 在加载完成后切换成 media=all。 -->
    <!-- no-inline 样式按原文件发布，依赖显式列出，避免未打包的 CSS @import。 -->
    <link rel="stylesheet" href="../../../src/styles/accent-vars.css?no-inline" media="print" data-boot-style />
    <link rel="stylesheet" href="../../../src/styles/theme-vars.css?no-inline" media="print" data-boot-style />
    <link rel="stylesheet" href="./style.css?no-inline" media="print" data-boot-style />
    <link rel="stylesheet" href="../../../src/styles/onboarding.css?no-inline" media="print" data-boot-style />
    <noscript>
      <!-- 万一脚本被禁用，样式照样要生效（此时没人去切换 media）。 -->
      <link rel="stylesheet" href="../../../src/styles/accent-vars.css?no-inline" media="all" />
      <link rel="stylesheet" href="../../../src/styles/theme-vars.css?no-inline" media="all" />
      <link rel="stylesheet" href="./style.css?no-inline" media="all" />
    </noscript>
    <!-- 启动占位提示（自带计时）：早于其他脚本，页面一进来就能显示「正在打开…」 -->
    <script src="/boot.js" vite-ignore defer></script>
    <!-- defer：不卡住 <body> 的解析（骨架屏因此能更早被浏览器读进来） -->
    <script src="/theme.js" vite-ignore defer></script>
    <script src="/url-utils.js" vite-ignore defer></script>
    <script src="/tab-navigation.js" vite-ignore defer></script>
    <script src="/storage-client.js" vite-ignore defer></script>
    <script src="/item-edit.js" vite-ignore defer></script>
    <script src="/item-state.js" vite-ignore defer></script>
  </head>
  <body class="booting">
    <header>
      <div class="brand"><img class="brand-icon" src="/icon128.png" vite-ignore width="25" height="25" alt="" />StaySide</div>

    </header>

    <main>
      <!-- 打开明显偏慢时，这里直接把「慢在哪一步」写出来（不用去设置页翻） -->
      <div id="panelDiagnostics"></div>

      <!-- 骨架屏：数据还没到时，按真实界面的轮廓先画一份灰色占位
           （顶部收藏条 / 搜索框 / 筛选 / 项目 / 卡片），形状和真界面对齐，
           真内容一来就是「原地填实」，不会整块跳一下。Vue 首批内容提交时整体撤掉。 -->
      <div id="bootSkeleton" aria-hidden="true">
        <div class="skel-save">
          <div class="sk sk-thumb-sm"></div>
          <div class="skel-lines">
            <div class="sk sk-line w40 xs"></div>
            <div class="sk sk-line w75"></div>
          </div>
          <div class="sk sk-btn"></div>
        </div>
        <div class="sk sk-search"></div>
        <div class="skel-filters">
          <div class="sk sk-pill"></div>
          <div class="sk sk-pill"></div>
          <div class="sk sk-pill"></div>
          <div class="sk sk-count"></div>
        </div>
        <div class="skel-chips">
          <div class="sk sk-chip w60"></div>
          <div class="sk sk-chip w80"></div>
          <div class="sk sk-chip w50"></div>
        </div>
        <div class="skel-list">
          <div class="skel-item">
            <div class="sk sk-thumb"></div>
            <div class="skel-copy">
              <div class="sk sk-line w35 xs"></div>
              <div class="sk sk-line w90"></div>
              <div class="sk sk-line w62"></div>
              <div class="sk sk-line w85 xs"></div>
              <div class="sk sk-line w55 xs"></div>
            </div>
          </div>
          <div class="skel-item">
            <div class="sk sk-thumb"></div>
            <div class="skel-copy">
              <div class="sk sk-line w30 xs"></div>
              <div class="sk sk-line w80"></div>
              <div class="sk sk-line w70"></div>
              <div class="sk sk-line w60 xs"></div>
              <div class="sk sk-line w45 xs"></div>
            </div>
          </div>
          <div class="skel-item">
            <div class="sk sk-thumb"></div>
            <div class="skel-copy">
              <div class="sk sk-line w40 xs"></div>
              <div class="sk sk-line w88"></div>
              <div class="sk sk-line w58"></div>
              <div class="sk sk-line w75 xs"></div>
              <div class="sk sk-line w50 xs"></div>
            </div>
          </div>
          <div class="skel-item">
            <div class="sk sk-thumb"></div>
            <div class="skel-copy">
              <div class="sk sk-line w32 xs"></div>
              <div class="sk sk-line w72"></div>
              <div class="sk sk-line w66"></div>
              <div class="sk sk-line w82 xs"></div>
              <div class="sk sk-line w40 xs"></div>
            </div>
          </div>
          <div class="skel-item">
            <div class="sk sk-thumb"></div>
            <div class="skel-copy">
              <div class="sk sk-line w38 xs"></div>
              <div class="sk sk-line w84"></div>
              <div class="sk sk-line w55"></div>
              <div class="sk sk-line w70 xs"></div>
              <div class="sk sk-line w48 xs"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 「正在打开…」提示条：只有等超过 1.2 秒才显示（快的时候界面保持干净），
           顺便带上实时秒数和久等时的建议；真内容画出来由 JS 移除。 -->
      <div id="bootTip" class="boot-tip" role="status" hidden>
        <span class="boot-dot"></span>
        <span id="bootTipText" data-i18n="openingSaves">正在打开网页…</span>
        <span id="bootTipTime" class="boot-time"></span>
        <span id="bootTipHint" class="boot-hint"></span>
      </div>

      <!-- 真界面：骨架屏还在的时候整块不占位（body.booting 时隐藏），
           免得「灰色占位」和「真内容」同时出现在屏幕上。 -->
      <div id="appBody">
      <div id="panelCurrent"></div>
      <div id="panelStatus"></div>

      <div id="panelControls"></div>

      <div id="panelEmpty"></div>
      <div id="panelItems"></div>
      </div>
    </main>

    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

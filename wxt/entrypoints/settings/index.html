<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 小红书等站点的图片 CDN 会拒绝来自 chrome-extension:// 的 Referer（返回 403），
         整页统一不发 Referer，收藏的封面与站点图标才能正常显示。 -->
    <meta name="referrer" content="no-referrer" />
    <title>LaterOn · 设置</title>
    <link rel="icon" href="/icon128.png" type="image/png" vite-ignore />
    <link rel="stylesheet" href="../../../src/styles/theme-vars.css" />
    <link rel="stylesheet" href="../../../src/styles/dialog.css" />
    <link rel="stylesheet" href="./style.css" />
    <!-- Keep the shared classic theme script early; WXT emits it separately. -->
    <script src="/theme.js" vite-ignore></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

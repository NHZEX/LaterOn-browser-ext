<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 小红书等站点的图片 CDN 会拒绝来自 chrome-extension:// 的 Referer（返回 403），
         整页统一不发 Referer，收藏的封面与站点图标才能正常显示。 -->
    <meta name="referrer" content="no-referrer" />
    <title>LaterOn - 有价值的网页，留给 LaterOn。</title>
    <link rel="icon" href="/icon128.png" type="image/png" vite-ignore />
    <link rel="stylesheet" href="../../../theme-vars.css" />
    <link rel="stylesheet" href="../../../dialog.css" />
    <link rel="stylesheet" href="../../../onboarding.css" />
    <link rel="stylesheet" href="../../../library.css" />
    <script src="/theme.js" vite-ignore></script>
    <script src="/i18n.js" vite-ignore></script>
    <script src="/dialog.js" vite-ignore></script>
    <script src="/picker-ui.js" vite-ignore></script>
    <script src="/onboarding.js" vite-ignore defer></script>
    <script src="/url-utils.js" vite-ignore></script>
    <script src="/tab-navigation.js" vite-ignore></script>
    <script src="/storage-client.js" vite-ignore></script>
    <script src="/item-edit.js" vite-ignore></script>
    <script src="/item-state.js" vite-ignore></script>
  </head>
  <body>
    <div class="shell">
      <header id="libraryHeader" class="topbar"></header>

      <div class="workspace">
        <aside id="projectSidebar" class="project-sidebar" data-i18n-aria-label="projectNav" aria-label="项目导航">
        </aside>

        <main>
        <section id="collectionToolbar" class="collection-bar"></section>

        <div id="libraryEmptyState"></div>
        <section id="cardGrid" class="grid" aria-live="polite"></section>
        <div id="boardView"></div>
        </main>

      </div>
    </div>

    <div id="bulkBar" class="bulk-bar">
          <span id="bulkCount" class="bulk-count" data-i18n="selectCount">已选 0 篇</span>
      <div class="bulk-actions">
        <button id="bulkSelectAll" type="button" data-i18n="selectAll">全选</button>
        <button id="bulkRead" type="button" data-i18n="markDone">标完成</button>
        <button id="bulkUnread" type="button" data-i18n="markUnread">标未读</button>
        <button id="bulkOpenWindow" type="button" data-i18n="openInNewWindow">在新窗口打开</button>
        <button id="bulkProject" class="bulk-project" type="button" data-i18n-aria-label="moveTo" aria-label="移动到项目" aria-haspopup="dialog">
          <span data-i18n="moveTo">移动到…</span>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
        </button>
        <button id="bulkDelete" type="button" class="danger" data-i18n="delete">删除</button>
        <button id="bulkDone" type="button" class="primary" data-i18n="done">完成</button>
      </div>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

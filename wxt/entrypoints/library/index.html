<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 小红书等站点的图片 CDN 会拒绝来自 chrome-extension:// 的 Referer（返回 403），
         整页统一不发 Referer，收藏的封面与站点图标才能正常显示。 -->
    <meta name="referrer" content="no-referrer" />
    <title>LaterOn - 有价值的网页，留给 LaterOn。</title>
    <link rel="icon" href="/icon128.png" type="image/png" vite-ignore />
    <link rel="stylesheet" href="../../../theme-vars.css" />
    <link rel="stylesheet" href="../../../dialog.css" />
    <link rel="stylesheet" href="../../../onboarding.css" />
    <link rel="stylesheet" href="../../../library.css" />
    <script src="/theme.js" vite-ignore></script>
    <script src="/i18n.js" vite-ignore></script>
    <script src="/dialog.js" vite-ignore></script>
    <script src="/picker-ui.js" vite-ignore></script>
    <script src="/onboarding.js" vite-ignore defer></script>
    <script src="/storage-client.js" vite-ignore></script>
  </head>
  <body>
    <div class="shell">
      <header id="libraryHeader" class="topbar"></header>

      <div class="workspace">
        <aside id="projectSidebar" class="project-sidebar" data-i18n-aria-label="projectNav" aria-label="项目导航">
        </aside>

        <main>
        <section id="collectionToolbar" class="collection-bar"></section>

        <div id="libraryEmptyState"></div>
        <div id="libraryCards"></div>
        <div id="boardView"></div>
        </main>

      </div>
    </div>

    <div id="libraryBulkToolbar"></div>
    <div id="libraryNotice"></div>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

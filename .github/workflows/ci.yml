name: Build and release extension

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LATERON_PUBLISH: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.bundle.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 3
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        timeout-minutes: 3
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: pnpm/action-setup@v6.1.0
        timeout-minutes: 3
        with:
          run_install: false
          cache: true
      - name: Install locked dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile
      - name: Check TypeScript
        timeout-minutes: 3
        run: pnpm typecheck
      - name: Run tests
        timeout-minutes: 8
        run: pnpm test
      - name: Check sidebar test isolation
        timeout-minutes: 2
        run: node --test --test-timeout=90000 tests/panel-fast-open.test.js
        env:
          PANEL_TEST_ORDER: reverse
      - name: Build local installation archive
        timeout-minutes: 3
        run: pnpm zip
      - name: Prepare checked release files
        id: bundle
        timeout-minutes: 1
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          pnpm release:prepare "${args[@]}"
      - name: Install test Chromium
        # Slow Ubuntu mirrors can take several minutes to download browser fonts.
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps --no-shell chromium
      - name: Test built extension in Chromium
        id: browser
        timeout-minutes: 8
        run: pnpm exec playwright test
      - name: Save browser failure diagnostics
        timeout-minutes: 2
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-${{ github.sha }}
          path: .output/browser-results
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      - name: Save checked packages
        id: upload
        timeout-minutes: 2
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lateron-${{ github.sha }}
          path: |
            .output/release/LaterOn-${{ steps.bundle.outputs.version }}.zip
            .output/release/LaterOn-${{ steps.bundle.outputs.version }}.zip.sha256
            .output/release/RELEASE_NOTES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: true

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the checked artifact
        timeout-minutes: 2
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: release
      - name: Publish complete release
        timeout-minutes: 5
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          sha256sum --check --strict "LaterOn-$VERSION.zip.sha256"
          gh release create "$RELEASE_TAG" \
            "LaterOn-$VERSION.zip" "LaterOn-$VERSION.zip.sha256" \
            --verify-tag --draft --title "LaterOn $VERSION" --notes-file RELEASE_NOTES.md
          gh release edit "$RELEASE_TAG" --draft=false
